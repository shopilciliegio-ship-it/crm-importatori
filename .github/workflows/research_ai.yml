name: Ricerca AI Importatori

on:
  # Lanciato SOLO dal timer esterno (Cloudflare Worker, timer-cloudflare/crm-importatori-timer.js) via API ogni giorno alle 7:00 Europe/Rome,
  # oppure a mano. Il cron `schedule` di GitHub è stato tolto il 23/9/2026: partiva con ore di ritardo
  # e faceva solo run doppi. Se il timer si ferma, lanciare a mano da GitHub UI.
  workflow_dispatch:        # trigger manuale dal CRM o da GitHub UI

permissions:
  contents: write

# Un solo run alla volta: timer esterno e lancio manuale non devono mai girare in parallelo.
concurrency:
  group: research-ai
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install -r scripts/requirements.txt

      - name: Ricerca AI importatori (paesi in coda, FIFO)
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          BREVO_API_KEY:  ${{ secrets.BREVO_API_KEY }}
          GH_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:        ${{ github.repository }}
        run: python scripts/research_ai.py
