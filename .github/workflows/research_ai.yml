name: Ricerca AI Importatori

on:
  schedule:
    # RISERVA. Il trigger principale è un timer esterno (Cloudflare Worker, timer-cloudflare/worker.js)
    # che lancia questo workflow via API (workflow_dispatch) alle 7:00 Europe/Rome tutto l'anno: il cron
    # di GitHub è "best effort" e in pratica parte con ore di ritardo (la mail di ricerca arrivava nel
    # primo pomeriggio invece che la mattina).
    - cron: '0 5 * * *'  # 05:00 UTC = 07:00 CEST (ora legale)
    - cron: '0 6 * * *'  # 06:00 UTC = 07:00 CET (ora solare)
  workflow_dispatch:        # trigger manuale dal CRM o da GitHub UI

permissions:
  contents: write

# Un solo run alla volta: timer esterno e cron di riserva non devono mai girare in parallelo.
concurrency:
  group: research-ai
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install -r scripts/requirements.txt

      - name: Ricerca AI importatori (paesi in coda, FIFO)
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          BREVO_API_KEY:  ${{ secrets.BREVO_API_KEY }}
          GH_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:        ${{ github.repository }}
        run: python scripts/research_ai.py
