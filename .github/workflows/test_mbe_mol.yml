name: Prova MBE Online (esterna, sola lettura)

# Prova ESTERNA al CRM: non scrive ordini.json, non fa commit. Solo manuale.
# Il log e' pubblico (repo pubblico): il dettaglio arriva per mail al destinatario del digest.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa dipendenze
        run: |
          pip install requests pyotp playwright zeep
          playwright install --with-deps chromium
      - name: Prova MBE Online
        env:
          MBE_EMAIL:            ${{ secrets.MBE_EMAIL }}
          MBE_PASSWORD:         ${{ secrets.MBE_PASSWORD }}
          MBE_TOTP_SECRET:      ${{ secrets.MBE_TOTP_SECRET }}
          MBE_ELINK_USERNAME:   ${{ secrets.MBE_ELINK_USERNAME }}
          MBE_ELINK_PASSPHRASE: ${{ secrets.MBE_ELINK_PASSPHRASE }}
          BREVO_API_KEY:        ${{ secrets.BREVO_API_KEY }}
          GH_TOKEN:             ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:              ${{ github.repository }}
        run: python scripts/test_mol_esterno.py
