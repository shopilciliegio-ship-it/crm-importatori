name: BWI Weekly Scrape + Sync CRM

on:
  # Lanciato SOLO dal timer esterno (Cloudflare Worker, timer-cloudflare/crm-importatori-timer.js) via API il lunedì alle 11:00 Europe/Rome,
  # oppure a mano. Il cron `schedule` di GitHub è stato tolto il 23/9/2026: partiva con ore di ritardo
  # e faceva solo run doppi. Se il timer si ferma, lanciare a mano da GitHub UI.
  workflow_dispatch:       # trigger manuale da GitHub UI

permissions:
  contents: write

# Un solo run alla volta: timer esterno e lancio manuale non devono mai girare in parallelo.
concurrency:
  group: bwi-weekly
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bwi-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests openpyxl

      - name: Scarica nuove + aggiornate (modalità 2)
        working-directory: BWI
        env:
          BWI_EMAIL:    ${{ secrets.BWI_EMAIL }}
          BWI_PASSWORD: ${{ secrets.BWI_PASSWORD }}
        run: python bestwine_scraper.py --auto 2

      - name: Unisce tutti gli xlsx in bestwine_ALL.xlsx
        working-directory: BWI
        run: python merge_all.py

      - name: Sincronizza XLSX con crm.json
        working-directory: BWI
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python bwi_sync_crm.py

      - name: Commit aggiornamenti
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BWI/bestwine_output/ data/contatti.json
          git diff --staged --quiet || git commit -m "BWI sync — $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push

      - name: Mail di allarme se il sync è fallito
        if: failure()
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: $BREVO_API_KEY" -H "Content-Type: application/json" \
            -d "{\"sender\":{\"email\":\"luca@sienawine.it\",\"name\":\"Siena Wine CRM\"},\"to\":[{\"email\":\"luca@ilciliegio.com\",\"name\":\"Luca\"}],\"subject\":\"BWI Sync FALLITO - controllare\",\"htmlContent\":\"<p>Il sync settimanale BWI e' fallito. Dettagli: <a href='$RUN_URL'>$RUN_URL</a></p><p>Le aziende nuove e aggiornate non sono state importate.</p>\"}" || true
