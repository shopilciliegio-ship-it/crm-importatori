name: Sync Wave Tracking Brevo

on:
  # Lanciato SOLO dal timer esterno (Cloudflare Worker, timer-cloudflare/crm-importatori-timer.js) via API alle 0/6/12/18 Europe/Rome,
  # oppure a mano. Il cron `schedule` di GitHub è stato tolto il 23/9/2026: partiva con ore di ritardo
  # e faceva solo run doppi. Se il timer si ferma, lanciare a mano da GitHub UI.
  workflow_dispatch:        # trigger manuale dal CRM o da GitHub UI

permissions:
  contents: write

# Un solo run alla volta: timer esterno e lancio manuale non devono mai girare in parallelo.
concurrency:
  group: sync-wave-tracking
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-wave-tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests

      - name: Backfill + sync aperture/click/bounce wave clienti
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GH_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER:      ${{ github.repository_owner }}
          GH_REPO:       ${{ github.event.repository.name }}
        run: python scripts/sync_wave_brevo_events.py
