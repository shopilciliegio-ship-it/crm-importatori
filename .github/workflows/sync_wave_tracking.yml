name: Sync Wave Tracking Brevo

on:
  schedule:
    # RISERVA. Il trigger principale è un timer esterno (Cloudflare Worker, timer-cloudflare/worker.js)
    # che lancia questo workflow via API (workflow_dispatch) alle 0/6/12/18 Europe/Rome: il cron di
    # GitHub è "best effort" e in pratica parte con ore di ritardo. Cadenza ridotta da ogni 4h a ogni
    # 6h il 22/9/2026 (richiesto da Luca: non cambiava nulla farlo più spesso).
    - cron: '0 */6 * * *'  # ogni 6 ore
  workflow_dispatch:        # trigger manuale dal CRM o da GitHub UI

permissions:
  contents: write

# Un solo run alla volta: timer esterno e cron di riserva non devono mai girare in parallelo.
concurrency:
  group: sync-wave-tracking
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-wave-tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests

      - name: Backfill + sync aperture/click/bounce wave clienti
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GH_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER:      ${{ github.repository_owner }}
          GH_REPO:       ${{ github.event.repository.name }}
        run: python scripts/sync_wave_brevo_events.py
