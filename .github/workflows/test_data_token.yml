name: Test token repo dati (sola lettura)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: API - il token vede il repo privato e può scriverci?
        env:
          T: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          [ -n "$T" ] && echo "secret presente" || { echo "SECRET MANCANTE"; exit 1; }
          curl -s -H "Authorization: token $T" https://api.github.com/repos/${{ github.repository_owner }}/crm-importatori-dati | python3 -c "import sys,json;d=json.load(sys.stdin);print('repo:',d.get('full_name'),'private:',d.get('private'),'permissions:',d.get('permissions'),d.get('message',''))"
          echo "--- lettura file via contents API"
          curl -s -o /dev/null -w "data/ordini.json HTTP %{http_code}\n" -H "Authorization: token $T" https://api.github.com/repos/${{ github.repository_owner }}/crm-importatori-dati/contents/data/ordini.json
          curl -s -o /dev/null -w "data/contatti.json (30MB, via blob) contents HTTP %{http_code}\n" -H "Authorization: token $T" https://api.github.com/repos/${{ github.repository_owner }}/crm-importatori-dati/contents/data/contatti.json
          echo "--- il token vede anche il repo pubblico (serve alla pagina CRM)?"
          curl -s -o /dev/null -w "crm-importatori HTTP %{http_code}\n" -H "Authorization: token $T" https://api.github.com/repos/${{ github.repository }}
          curl -s -o /dev/null -w "elenco workflow pubblico HTTP %{http_code}\n" -H "Authorization: token $T" https://api.github.com/repos/${{ github.repository }}/actions/workflows
      - name: Checkout del repo privato
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/crm-importatori-dati
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _priv
          fetch-depth: 1
      - name: Contenuto
        run: |
          ls _priv/data | head -30
          du -sh _priv/data _priv/BWI/bestwine_output
