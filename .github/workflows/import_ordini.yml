name: Import Ordini da Gmail

on:
  schedule:
    - cron: '0 */4 * * *'  # ogni 4 ore
  workflow_dispatch:        # trigger manuale dal CRM o da GitHub UI

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze
        run: pip install -r scripts/requirements.txt

      - name: Installa dipendenze Node
        run: npm install

      # Ogni step da qui in poi ha timeout-minutes + continue-on-error: true.
      # Prima non li aveva nessuno dei due: un blocco di rete in un singolo step
      # (successo il 31/08 su questo, IMAP Gmail senza timeout — vedi import_ordini.py)
      # restava appeso fino al limite di 6 ore di GitHub Actions, e TUTTI gli step
      # successivi (incluso SpedirePro) venivano saltati senza nessun errore visibile.
      # Ora un problema in uno step si ferma in max 10-15 minuti e non blocca gli altri.
      - name: Importa ordini
        timeout-minutes: 10
        continue-on-error: true
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:            ${{ github.repository }}
        run: python scripts/import_ordini.py

      - name: Genera MOS ordini Shop Online
        timeout-minutes: 10
        continue-on-error: true
        env:
          GH_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:       ${{ github.repository }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: node scripts/generate_mos_shop.js

      - name: Fetch tracking Fieramente
        timeout-minutes: 15
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:  ${{ github.repository }}
          # FIERAMENTE_USER e FIERAMENTE_PASS opzionali — fallback hardcoded nello script
        run: python scripts/fetch_fieramente_tracking.py

      - name: Cerca spedizioni SpedirePro
        timeout-minutes: 15
        continue-on-error: true
        env:
          SPEDIREPRO_EMAIL:    ${{ secrets.SPEDIREPRO_EMAIL }}
          SPEDIREPRO_PASSWORD: ${{ secrets.SPEDIREPRO_PASSWORD }}
          GH_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:             ${{ github.repository }}
        run: python scripts/fetch_spedirepro_shipments.py

      - name: Fetch tracking Spedire.com
        timeout-minutes: 10
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:  ${{ github.repository }}
        run: python scripts/fetch_spedire_tracking.py

      - name: Fetch tracking 17Track (UPS)
        timeout-minutes: 10
        continue-on-error: true
        env:
          TRACK17_API_KEY: ${{ secrets.TRACK17_API_KEY }}
          GH_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:         ${{ github.repository }}
        run: python scripts/fetch_17track_tracking.py

      # ── MBE pubblico — DORMIENTE (mbe.it bloccato da Akamai WAF, mai funzionato) ──
      # Sostituito da 17Track. Riattivare rimuovendo "if: false" richiede anche
      # di rimettere lo step "Installa Playwright browser" (rimosso perché
      # inutile finché questo resta dormiente).
      - name: Fetch tracking MBE pubblico (mbe.it)
        if: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:  ${{ github.repository }}
        run: python scripts/fetch_mbe_public_tracking.py

      # ── MBE tracking via login — DORMIENTE (API interna stantia per vino) ───
      # Riattivare rimuovendo "if: false"
      - name: Fetch tracking MBE
        if: false
        env:
          MBE_EMAIL:       ${{ secrets.MBE_EMAIL }}
          MBE_PASSWORD:    ${{ secrets.MBE_PASSWORD }}
          MBE_TOTP_SECRET: ${{ secrets.MBE_TOTP_SECRET }}
          GH_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:         ${{ github.repository }}
        run: python scripts/fetch_mbe_tracking.py
      # ────────────────────────────────────────────────────────────────────────

      - name: Invia reminder email temporizzati
        timeout-minutes: 10
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GH_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:       ${{ github.repository }}
        run: python scripts/send_reminders.py

      - name: Invia follow-up importatori
        timeout-minutes: 10
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GH_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:       ${{ github.repository }}
        run: python scripts/send_importatori_followup.py

      - name: Salva screenshot debug MBE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbe-debug-screenshots
          path: /tmp/mbe_*.png
          if-no-files-found: ignore
